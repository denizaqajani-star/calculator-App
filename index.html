<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pink Sky Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator">
    <header class="topbar">
      <h1>pink<span>sky.</span></h1>
      <div class="theme-control" aria-label="Color theme">
        <span>THEME</span>
        <div class="theme-options" role="group" aria-label="Choose theme">
          <button class="theme-choice active" data-theme="1" aria-label="Theme 1: Pink Sky" 
aria-pressed="true">1</button>
          <button class="theme-choice" data-theme="2" aria-label="Theme 2: Blue Sky" 
aria-pressed="false">2</button>
          <button class="theme-choice" data-theme="3" aria-label="Theme 3: Night Sky" 
aria-pressed="false">3</button>
        </div>
      </div>
    </header>
    <div class="display" aria-live="polite">
      <div class="expression" id="expression"></div>
      <output id="display" aria-label="Calculator result">0</output>
    </div>
    <section class="keypad" aria-label="Calculator buttons">
      <button class="key" data-value="7">7</button>
      <button class="key" data-value="8">8</button>
      <button class="key" data-value="9">9</button>
      <button class="key utility" data-action="delete">DEL</button>
      <button class="key" data-value="4">4</button>
      <button class="key" data-value="5">5</button>
      <button class="key" data-value="6">6</button>
      <button class="key operator" data-value="+">+</button>
      <button class="key" data-value="1">1</button>
      <button class="key" data-value="2">2</button>
      <button class="key" data-value="3">3</button>
      <button class="key operator" data-value="-">-</button>
      <button class="key" data-value=".">.</button>
      <button class="key" data-value="0">0</button>
      <button class="key operator" data-value="/">÷</button>
      <button class="key operator" data-value="*">×</button>
      <button class="key reset" data-action="reset">RESET</button>
      <button class="key equals" data-action="equals">=</button>
    </section>
    <p class="hint">Simple calculations, clear results · Esc to reset</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
